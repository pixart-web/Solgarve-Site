# Integrate into the actual site's server block after reviewing its existing configuration.
# Do not replace TLS, access controls or unrelated locations.
root /var/www/solgarve/dist;
index index.html;
error_page 404 /404.html;
location = / { return 302 /pt/; }
location / { try_files $uri $uri/ =404; }
# Review only. Remove after documented launch approval.
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
